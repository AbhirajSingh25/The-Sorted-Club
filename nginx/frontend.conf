# ==============================================================================
# The Sorted Club — Internal Frontend Nginx Configuration
# Serves React SPA static assets and provides client-side route fallback
# ==============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers for Frontend
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Caching (Vite bundle with content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # React SPA Fallback: Serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
