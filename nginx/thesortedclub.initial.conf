# ==============================================================================
# The Sorted Club — Initial Bootstrap Nginx Configuration (Pre-SSL)
# Use this configuration ONLY during initial server setup to obtain Let's Encrypt certificates.
# Once certificates are issued, switch back to 'thesortedclub.conf'.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name thesortedclub.com www.thesortedclub.com;

    # Let's Encrypt / Certbot ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Temporary fallback during initial verification
    location / {
        return 200 "The Sorted Club Server Initialization — Let's Encrypt Bootstrap Ready.\n";
        add_header Content-Type text/plain;
    }
}
